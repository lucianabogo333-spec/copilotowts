<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>COPILOTO PRO - SEMPRE NO TOPO</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { --bg:#020617; --primary:#3b82f6; --accent:#f59e0b; --success:#22c55e; }
  body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 15px; overflow: hidden; }
  
  /* Canvas escondido que gera a imagem que flutua */
  #pipCanvas { background: #0f172a; display: none; }
  
  .hub { border: 2px solid var(--primary); padding: 15px; border-radius: 15px; background: #1e293b; }
  textarea { width: 100%; height: 60px; margin: 10px 0; border-radius: 8px; border: none; padding: 10px; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; color: white; margin-bottom: 10px; }
  
  video { width: 300px; border-radius: 12px; border: 2px solid var(--accent); display: none; }
</style>
</head>
<body>

<div class="hub">
    <div style="font-size: 12px; font-weight: 900; color: var(--accent); margin-bottom: 10px;">🚀 CONTROLE MESTRE</div>
    
    <button onclick="ativarFlutuante()" class="btn" style="background: var(--primary);">💎 ATIVAR MODO SEMPRE NO TOPO</button>
    
    <button onclick="lerZap()" class="btn" style="background: var(--success);">📋 ANALISAR WHATSAPP</button>
    <textarea id="input" placeholder="O que o cliente disse?"></textarea>
    
    <div id="status" style="font-size: 10px; color: #94a3b8;">Modo: Aguardando comando...</div>
</div>

<canvas id="pipCanvas" width="400" height="500"></canvas>
<video id="pipVideo" autoplay muted playsinline></video>

<script>
const canvas = document.getElementById('pipCanvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('pipVideo');
let notes = [];

const base = {
    products: [
        { name: "LOTE CARVALHOS", keys: ["carvalhos", "shopping"], info: "R$ 1.299/mês | 300m²" },
        { name: "RENASCER", keys: ["renascer", "lago"], info: "R$ 695/mês | Com Lago" }
    ],
    objections: [
        { keys: ["caro", "preço"], r: "Lucro futuro > Custo de hoje." }
    ]
};

// FUNÇÃO PARA ATIVAR O MODO QUE FICA POR CIMA DE TUDO
async function ativarFlutuante() {
    const stream = canvas.captureStream();
    video.srcObject = stream;
    try {
        await video.play();
        await video.requestPictureInPicture();
    } catch (e) {
        alert("Erro: O seu navegador precisa de permissão para abrir janelas flutuantes.");
    }
}

async function lerZap() {
    const text = await navigator.clipboard.readText();
    document.getElementById("input").value = text;
    processar(text.toLowerCase());
}

function processar(t) {
    const p = base.products.find(x => x.keys.some(k => t.includes(k)));
    const o = base.objections.find(x => x.keys.some(k => t.includes(k)));

    notes = []; // Limpa
    if(p) notes.push({t: p.name, c: p.info, color: "#3b82f6"});
    if(o) notes.push({t: "OBJEÇÃO", c: o.r, color: "#f59e0b"});
    
    desenharPainel();
}

// DESENHA TUDO NO CANVAS (QUE SERÁ O VÍDEO FLUTUANTE)
function desenharPainel() {
    // Fundo
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Título
    ctx.fillStyle = "#3b82f6";
    ctx.font = "bold 20px Arial";
    ctx.fillText("COPILOTO PRO", 20, 40);

    // Caixas de Texto (Stickies)
    notes.forEach((note, i) => {
        const y = 70 + (i * 130);
        ctx.fillStyle = note.color;
        ctx.fillRect(20, y, 360, 110);
        
        ctx.fillStyle = "white";
        ctx.font = "bold 16px Arial";
        ctx.fillText(note.t, 35, y + 30);
        
        ctx.font = "14px Arial";
        ctx.fillText(note.c, 35, y + 65);
    });

    if(notes.length === 0) {
        ctx.fillStyle = "#64748b";
        ctx.fillText("Aguardando conversa no Zap...", 20, 100);
    }
}

// Atualiza o painel a cada segundo
setInterval(desenharPainel, 1000);

function initApp() {
    desenharPainel();
}
</script>
</body>
</html>
