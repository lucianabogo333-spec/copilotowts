<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COPILOTO PRO — Dados Oficiais</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root{
    --bg:#f8fafc; --panel:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --primary:#2563eb; --accent:#f59e0b; --success:#16a34a; --radius:12px;
  }

  *{box-sizing:border-box; font-family: 'Inter', system-ui, sans-serif;}
  body{ margin:0; background: var(--bg); color: var(--text); transition: 0.3s; }

  /* MODO JANELA FLUTUANTE (POP-OUT) */
  body.popout-mode { background: #0f172a; padding: 10px; }
  body.popout-mode .eco-header, body.popout-mode header { display: none; }
  body.popout-mode main { grid-template-columns: 1fr; margin: 0; padding: 0; width: 100%; }
  body.popout-mode #asideDireita { display: none; } /* Esconde o gráfico no modo pequeno para dar espaço */

  .eco-header { background: #0f172a; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .eco-stats { display: flex; gap: 20px; }
  .eco-item span { color: var(--accent); font-weight: 800; margin-left: 5px; }
  #live-clock { font-family: monospace; font-size: 15px; color: #fff; border-left: 1px solid #334155; padding-left: 20px; }

  header{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,.9); backdrop-filter: blur(10px); border-bottom:1px solid var(--border); padding:10px 20px; }
  .topbar{ max-width:1400px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
  
  main{ max-width:1400px; margin:20px auto; padding:0 20px; display:grid; grid-template-columns: 350px 1fr 400px; gap:20px; }

  .card{ background:white; border-radius:var(--radius); border:1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow:hidden; margin-bottom:15px;}
  .card-head{ padding:12px 15px; border-bottom:1px solid var(--border); background:#f8fafc; font-weight:800; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing: 1px; }
  .card-body{ padding:15px; }

  .info-block { background: #f1f5f9; border-radius: 8px; padding: 12px; margin-top: 10px; }
  .info-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e2e8f0; font-size: 13px; }

  .loss-value { color: #dc2626; font-size: 20px; font-weight: 800; }

  button, .btn-link{ padding:10px 20px; border-radius:8px; border:none; cursor:pointer; font-weight:700; transition: 0.2s; text-decoration: none; display: inline-block; text-align: center; }
  .btn-primary{ background: var(--primary); color:white; width:100%; }
  .btn-success{ background: var(--success); color:white; width:100%; margin-top:15px; font-size:14px; }
  .btn-zap { background: #25d366; color: white; margin-bottom: 10px; width: 100%; }
  .btn-pop { background: var(--accent); color: black; font-size: 10px; }

  input, textarea, select { width:100%; padding:10px; margin: 5px 0 12px 0; border:1px solid var(--border); border-radius:8px; }

  #adminDrawer{ position:fixed; inset:0; display:none; z-index:100; }
  #adminDrawer.show{ display:flex; }
  .drawer-content{ width:min(850px, 95%); background:white; margin-left:auto; height:100%; box-shadow:-20px 0 50px rgba(0,0,0,0.2); display:flex; flex-direction:column; }
  .drawer-body{ flex:1; overflow-y:auto; padding:30px; }

  @media (max-width: 1100px){ main{ grid-template-columns: 1fr; } }
</style>
</head>
<body onload="startTime(); updateEcoRates(); checkPopout();">

<div class="eco-header">
  <div class="eco-stats">
    <div class="eco-item">SELIC: <span id="val-selic">...</span></div>
    <div class="eco-item">IPCA: <span id="val-ipca">...</span></div>
    <div class="eco-item">IGP-M: <span id="val-igpm">...</span></div>
  </div>
  <div id="live-clock">00:00:00</div>
</div>

<header>
  <div class="topbar">
    <div><strong>COPILOTO PRO</strong> <span id="userBadge" style="font-size:10px; background:#eee; padding:2px 6px; border-radius:4px;"></span></div>
    <div id="userTools" style="display:none; gap:10px;">
      <button class="btn-pop" onclick="abrirJanelaFlutuante()">🚀 FLUTUAR SOBRE WHATSAPP</button>
      <button class="btn-outline" onclick="openAdmin()">⚙️ Painel de Edição</button>
      <button onclick="location.reload()">Sair</button>
    </div>
  </div>
</header>

<div id="loginArea" style="position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; align-items:center; justify-content:center;">
  <div class="card" style="width:350px; padding:30px;">
    <h2>Acesso Portal</h2>
    <input id="lUser" type="text" placeholder="Usuário" value="edson">
    <input id="lPass" type="password" placeholder="Senha" value="2026">
    <button class="btn-primary" onclick="initApp()" style="width:100%">Entrar</button>
  </div>
</div>

<main id="appMain" style="opacity:0.1; pointer-events:none;">
  <aside id="asideEsquerda">
    <div class="card">
      <div class="card-head">Ficha Técnica do Imóvel</div>
      <div class="card-body">
        <h2 id="view-name" style="color:var(--primary); margin:0 0 10px 0;">Aguardando...</h2>
        <div id="view-details" class="info-block"></div>
        <div id="area-links" style="margin-top:10px; display:none;">
            <a id="btn-mapa" href="#" target="_blank" class="btn-primary" style="display:block; text-align:center; background:#000; margin-bottom:5px;">🗺️ ABRIR MAPA</a>
            <button onclick="copiarPrompt()" class="btn-primary" style="width:100%; background:var(--accent); color:#000;">🎨 COPIAR PROMPT IA</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Procrastinação (12 meses)</div>
      <div class="card-body" style="background:#fff7ed; text-align:center;">
        <div class="loss-value" id="view-loss">R$ 0,00</div>
      </div>
    </div>
  </aside>

  <section>
    <div class="card">
      <div class="card-head">Escuta Estratégica</div>
      <div class="card-body">
        <button onclick="lerAreaTransferencia()" class="btn-zap">📋 ANALISAR TEXTO COPIADO DO ZAP</button>
        <textarea id="mainInput" placeholder="O que o cliente está dizendo?" style="min-height:350px;"></textarea>
        <button class="btn-primary" id="micBtn" onclick="toggleMic()" style="width:100%; margin-top:10px; height:50px;">🎙️ Capturar Voz</button>
      </div>
    </div>
  </section>

  <aside id="asideDireita">
    <div class="card"><div class="card-head">Quebra Sugerida</div><div class="card-body">
      <div id="res-box" style="font-size:15px; line-height:1.5;">Aguardando...</div>
    </div></div>
    <div class="card"><div class="card-head">Projeção Patrimonial</div><div class="card-body"><canvas id="mainChart"></canvas></div></div>
  </aside>
</main>

<div id="adminDrawer">
  <div style="flex:1; background:rgba(0,0,0,0.6)" onclick="closeAdmin()"></div>
  <div class="drawer-content">
      <div class="drawer-body">
          <h2>Gestão de Dados</h2>
          <p>Edite os produtos e objeções diretamente aqui.</p>
          <div id="lista-edicao"></div>
          <button class="btn-primary" onclick="copyFullCode()">🚀 COPIAR CÓDIGO ATUALIZADO</button>
      </div>
  </div>
</div>

<script>
// BASE DE DADOS COMPLETA
let base = {
    users: [{login:"edson", pass:"2026", role:"admin"}],
    products: [
        { name: "LOTEAMENTO CARVALHOS", keys: ["carvalhos", "shopping"], baseVal: 150000, rate: 15, mapa: "LINK_DRIVE", prompt: "Casa moderna Sinop", info: ["📍 Próximo Shopping", "📏 300m²", "🚫 Sem Entrada"] },
        { name: "RECANTO RENASCER", keys: ["renascer", "carmem"], baseVal: 85000, rate: 18, mapa: "LINK_DRIVE", prompt: "Chácara Lago", info: ["🌳 Sta Carmem", "🌊 Com Lago"] }
    ],
    objections: [
        { keys: ["caro", "preço"], a: "Caro em relação a quê?", b: "Preço é o que paga, valor é o que ganha.", c: "O lucro futuro paga o terreno." }
    ]
};

// FUNÇÕES DE SISTEMA
function checkPopout() {
    if (window.innerWidth < 500) { document.body.classList.add('popout-mode'); }
}

function abrirJanelaFlutuante() {
    const win = window.open(window.location.href, 'CopilotoZap', 'width=400,height=700,menubar=no,toolbar=no,location=no');
}

async function lerAreaTransferencia() {
    const text = await navigator.clipboard.readText();
    document.getElementById("mainInput").value = text;
    document.getElementById("mainInput").dispatchEvent(new Event('input'));
}

document.getElementById("mainInput").addEventListener("input", function() {
  const t = this.value.toLowerCase();
  const p = base.products.find(item => item.keys.some(k => t.includes(k)));
  if(p) {
    document.getElementById("view-name").innerText = p.name;
    document.getElementById("view-details").innerHTML = p.info.map(i => `<div class="info-item">${i}</div>`).join("");
    document.getElementById("area-links").style.display = "block";
    document.getElementById("btn-mapa").href = p.mapa;
    const loss = p.baseVal * (p.rate / 100);
    document.getElementById("view-loss").innerText = `R$ ${loss.toLocaleString('pt-BR')}`;
    updateChart(p.baseVal, p.rate);
  }
  const o = base.objections.find(item => item.keys.some(k => t.includes(k)));
  if(o) document.getElementById("res-box").innerHTML = `<b>Leve:</b> ${o.a}<br><br><b>Forte:</b> ${o.b}`;
});

// RECONHECIMENTO DE VOZ MANTIDO
let rec;
if(window.webkitSpeechRecognition) {
  rec = new webkitSpeechRecognition();
  rec.lang = 'pt-BR'; rec.continuous = true;
  rec.onresult = (e) => {
    document.getElementById("mainInput").value += " " + e.results[e.results.length-1][0].transcript;
    document.getElementById("mainInput").dispatchEvent(new Event('input'));
  };
}

function toggleMic() {
  const b = document.getElementById("micBtn");
  if(b.innerText.includes("Capturar")) { rec.start(); b.style.background = "red"; b.innerText = "🛑 PARAR"; }
  else { rec.stop(); b.style.background = "var(--primary)"; b.innerText = "🎙️ Capturar Voz"; }
}

// GRÁFICO MANTIDO
let chart;
function initChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: ['Hoje', 'Ano 1', 'Ano 2', 'Ano 3'], datasets: [{ label: 'Patrimônio', data: [0,0,0,0], borderColor: '#2563eb', fill: true }] }
  });
}

function updateChart(v, r) {
  let data = [v];
  for(let i=1; i<=3; i++) { v *= (1+(r/100)); data.push(Math.round(v)); }
  chart.data.datasets[0].data = data;
  chart.update();
}

function initApp() {
  if(document.getElementById("lPass").value === "2026") {
    document.getElementById("loginArea").style.display = "none";
    document.getElementById("appMain").style.opacity = "1";
    document.getElementById("appMain").style.pointerEvents = "all";
    document.getElementById("userTools").style.display = "flex";
    initChart();
  }
}

function startTime() { document.getElementById('live-clock').innerHTML = new Date().toLocaleTimeString('pt-BR'); setTimeout(startTime, 1000); }
async function updateEcoRates() { 
    document.getElementById('val-selic').innerText = '11.25%'; 
    document.getElementById('val-ipca').innerText = '4.5%';
    document.getElementById('val-igpm').innerText = '0.9%';
}
function openAdmin() { document.getElementById("adminDrawer").classList.add("show"); }
function closeAdmin() { document.getElementById("adminDrawer").classList.remove("show"); }
</script>
</body>
</html>
